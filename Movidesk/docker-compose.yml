# Deploy do painel numa VM já existente (Postgres e a apidatalake são
# serviços externos — não sobem aqui). Ver DEPLOY.md para o passo a passo
# completo na VM OCI.
services:
  painel:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      # O Node limita o heap a ~2 GB por padrão e o servidor caiu por falta de memória (10/10/2026); a VM tem ~11 GB.
      NODE_OPTIONS: --max-old-space-size=4096
      # Painel Geral e Início rodam num segundo processo Node (server/utils/leitor.js); LEITOR=0 volta para um processo só.
      LEITOR: "1"
    ports:
      - "${PORT:-5000}:${PORT:-5000}"
    volumes:
      # server/routes/jira.js resolve JIRA_DATA_DIR (padrão "../Jira") para
      # /Jira dentro do container (dois níveis acima de server/routes). Sem
      # este bind mount o caminho fica vazio na imagem e toda a aba Jira
      # falha com "Arquivo não encontrado" mesmo com o jira_extractor.py
      # rodando certinho no host — ele escreve em ../Jira (fora do build
      # context, que é só a pasta Movidesk/), o container nunca vê esses
      # arquivos. Montado read-only: este serviço só lê os JSONs.
      - ../Jira:/Jira:ro
    restart: unless-stopped

<!DOCTYPE html>
<html lang="pt-BR">
<head>
<script>window.__hubSemMedidor = true; /* quem mede é o iframe interno */</script>
<script src="../js/ui-version.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Configurações - Embed</title>
    <style>
        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            background: transparent;
            overflow: hidden;
        }
        .embedded-view-frame {
            width: 100%;
            height: 100%;
            border: 0;
            display: block;
            
        }
        .embedded-view-frame.loaded {
            opacity: 1;
        }
    </style>
<script src="../js/ordenar-tabelas.js" defer></script>
<link rel="stylesheet" href="../css/sem-animacao.css">
</head>
<body>
    <iframe
        id="configFrame"
        class="embedded-view-frame loaded"
        src="../index.html?legacyView=configuracoes"
        title="Configurações"
    ></iframe>

    <script>
        // O progresso vem do iframe interno (js/ui-version.js dele) e é repassado ao shell: a persiana só abre
        // quando os dados da tela interna já estão desenhados. Sem loader próprio (só a persiana anima).
        (function () {
            var frame = document.getElementById('configFrame');
            window.addEventListener('message', function (e) {
                if (e.source !== frame.contentWindow || !e.data || e.data.tipo !== 'hub360:carga') return;
                try { window.parent.postMessage(e.data, location.origin); } catch (_) {}
            });
        })();
    </script>
</body>
</html>

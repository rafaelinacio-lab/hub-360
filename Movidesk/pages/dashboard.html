<!DOCTYPE html>
<html lang="pt-BR">
<head>
<script>window.__hubSemMedidor = true; /* quem mede é o iframe interno */</script>
<script src="../js/ui-version.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@700;800&family=Inter:wght@400;500&display=swap">
    <script>
        (function () {
            const t = localStorage.getItem('theme') || 'light';
            document.documentElement.setAttribute('data-theme', t);
            window.addEventListener('storage', function (e) {
                if (e.key === 'theme') document.documentElement.setAttribute('data-theme', e.newValue || 'light');
            });
        })();
    </script>
    <style>
        /* ── Tokens ── */
        :root {
            --db-bg:      #f0f4f8;
            --db-surface: #ffffff;
            --db-text:    #1a2638;
            --db-sub:     #556a80;
            --db-border:  #dde4ec;
            --db-em:      #10b981;
            --db-blue:    #378add;
            --db-dark:    #0a1628;
        }
        @media (prefers-color-scheme: dark) {
            :root:not([data-theme="light"]) {
                --db-bg:      #0a1628;
                --db-surface: #111c2e;
                --db-text:    #e2e8f0;
                --db-sub:     #8fa3b8;
                --db-border:  #1e2d40;
            }
        }
        :root[data-theme="dark"] {
            --db-bg:      #0a1628;
            --db-surface: #111c2e;
            --db-text:    #e2e8f0;
            --db-sub:     #8fa3b8;
            --db-border:  #1e2d40;
        }

        *, *::before, *::after { box-sizing: border-box; }

        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            overflow: hidden;
            background: var(--db-bg);
        }

        /* ── iframe ── */
        .db-frame {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            border: 0;
        }
    </style>
<script src="../js/ordenar-tabelas.js" defer></script>
<link rel="stylesheet" href="../css/sem-animacao.css">
</head>
<body>

    <!-- ── iframe do Dashboard ── -->
    <iframe
        id="dashboardFrame"
        class="db-frame visible"
        src="../index.html?legacyView=dashboard"
        title="Dashboard"
    ></iframe>

    <script>
        // O progresso vem do iframe interno (js/ui-version.js dele) e é repassado ao shell: a persiana só abre
        // quando os dados da tela interna já estão desenhados. Sem loader próprio (só a persiana anima).
        (function () {
            var frame = document.getElementById('dashboardFrame');
            window.addEventListener('message', function (e) {
                if (e.source !== frame.contentWindow || !e.data || e.data.tipo !== 'hub360:carga') return;
                try { window.parent.postMessage(e.data, location.origin); } catch (_) {}
            });
        })();
    </script>

<script src="/js/telemetria.js"></script>
</body>
</html>

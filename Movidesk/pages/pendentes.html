<style>

.pd{padding:16px 24px 18px;display:flex;flex-direction:column;gap:12px;min-height:100vh}
.pd-top{display:flex;align-items:center;gap:14px;flex-wrap:wrap}

.pd-top h1{margin:0;font-size:22px;font-weight:800;letter-spacing:-.01em;display:flex;align-items:center;gap:8px}.pd-top h1 .sym{color:var(--or);font-size:24px}

.tv .visao-tv{display:none}
.pd-top p{margin:2px 0 0;color:var(--t3);font-size:12px}
.sp{flex:1}
.md-tabs{display:flex;gap:3px;background:var(--s2);padding:3px;border-radius:10px;border:1px solid var(--b);flex-shrink:0}
.md-tab{border:0;background:transparent;color:var(--t2);font:700 12.5px Manrope;padding:7px 12px;border-radius:8px;cursor:pointer;display:flex;align-items:center;gap:6px}

.pd-kp{display:grid;grid-template-columns:repeat(6,1fr);gap:10px}
.k{background:var(--s);border:1px solid var(--b);border-radius:14px;padding:12px 14px;box-shadow:var(--sh);display:flex;flex-direction:column;gap:3px;border-left:4px solid var(--c)}
.k .l{display:flex;justify-content:space-between;align-items:center;color:var(--t2);font-weight:700;font-size:12px}.k .l i{width:26px;height:26px;border-radius:8px;background:var(--cb);color:var(--c);display:grid;place-items:center}.k .l i .sym{font-size:16px}
.k .v{font-size:30px;font-weight:800;line-height:1.05;color:var(--c);letter-spacing:-.02em;font-variant-numeric:tabular-nums}.k .d{font-size:11.5px;color:var(--t3);font-weight:600}

.don{display:flex;gap:16px;align-items:center;flex:1}
.ring{width:132px;height:132px;border-radius:50%;flex:none;display:grid;place-items:center}
.ring div{width:94px;height:94px;border-radius:50%;background:var(--s);display:grid;place-items:center;text-align:center;line-height:1}.ring b{font-size:30px;font-weight:800;display:block}.ring span{font-size:10.5px;color:var(--t3);font-weight:700;display:block;margin-top:2px}
.lg{display:flex;flex-direction:column;gap:5px;flex:1}.lg div{display:flex;align-items:center;gap:8px;padding:5px 8px;border-radius:9px;background:var(--s2);font-weight:700;color:var(--t2);cursor:pointer;border:1px solid transparent}.lg div.on{border-color:var(--or)}.lg i{width:10px;height:10px;border-radius:3px;background:var(--c)}.lg b{margin-left:auto;color:var(--t1);font-size:14px}.lg small{color:var(--t3);font-weight:600;min-width:40px;text-align:right}
.br{display:flex;flex-direction:column;justify-content:space-around;flex:1;gap:5px}.br .r{display:grid;grid-template-columns:minmax(0,36%) 1fr 78px;gap:10px;align-items:center;cursor:pointer;border-radius:8px;padding:1px 4px}.br .r:hover,.br .r.on{background:var(--s2)}.br .n{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tr{height:10px;border-radius:99px;background:var(--s2);display:flex;overflow:hidden}.tr i{display:block;height:100%}.br .v{text-align:right;font-weight:800;font-size:14px}.br .v small{color:var(--red);font-weight:700;font-size:10.5px;margin-left:4px}
.leg{display:flex;gap:12px;font-size:11px;color:var(--t3);font-weight:600;margin-top:4px}.leg i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:5px}
.vazio{color:var(--t3);font-weight:600;padding:14px 0;text-align:center}
.tool{display:flex;gap:8px;align-items:center;margin-bottom:8px;flex-wrap:wrap}.tool h3{margin:0}
.srch{border:1px solid var(--b);border-radius:9px;background:var(--s2);padding:6px 11px;color:var(--t1);width:300px;font:600 12.5px Manrope}
.pill{border:1px solid var(--b);border-radius:999px;padding:5px 11px;font:700 12px Manrope;color:var(--t2);background:var(--s2);cursor:pointer}.pill.on{background:var(--t1);color:var(--s);border-color:var(--t1)}
.tw{overflow:auto;max-height:560px;border-top:1px solid var(--b)}
table{width:100%;border-collapse:collapse}th{position:sticky;top:0;background:var(--s);z-index:2;text-align:left;font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--t3);font-weight:800;padding:8px 8px;border-bottom:1px solid var(--b);white-space:nowrap;cursor:pointer;user-select:none}th:hover{color:var(--t1)}th.on{color:var(--or)}th .ar{font-size:10px;margin-left:3px}

.id a{font-weight:800;color:var(--az);text-decoration:none}.id a:hover{text-decoration:underline}.cl b{display:block;font-weight:700;max-width:330px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.cl small{color:var(--t3);font-weight:500;font-size:11.5px;display:block;max-width:330px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* Modo TV (?tv=1): tela cheia sem controles, escala pela tela, a lista rola sozinha e atualiza a cada minuto */
body.tv{overflow:hidden}
.tv-relogio{display:none;font-size:30px;font-weight:800;font-variant-numeric:tabular-nums}
.tv .tv-relogio{display:block}
.tv .pd-top .md-tabs,.tv .pd-top .bt,.tv .tool .srch,.tv .tool .pill,.tv #colunas,.tv .mais,.tv .chip,.tv .rod{display:none}

<body>
<div class="pd">
  <div class="pd-top">
    <div><div class="brand"><i>H</i><b>Hub&nbsp;360</b><span class="brand-sep"></span><span class="brand-sub">Backlog de chamados · <em id="tit">Geral</em></span></div><p id="sub">Carregando…</p></div>

      <button class="md-tab" onclick="mdSwitchTab('movidesk')"><span class="sym">dashboard</span>Painel Geral</button>
      <button class="md-tab" onclick="mdSwitchTab('satisfacao')"><span class="sym">sentiment_satisfied</span>Satisfação</button>
      <button class="md-tab" onclick="mdSwitchTab('chats')"><span class="sym">forum</span>Chats</button>
      <button class="md-tab active" onclick="mdSwitchTab('pendentes')"><span class="sym">tv</span>Painel TV</button>
    </div>
    <button class="bt" onclick="carregar()"><span class="sym">refresh</span>Atualizar</button>
    <button class="bt" onclick="exportarCsv()"><span class="sym">download</span>Exportar</button>
    <button class="bt" onclick="abrirModoTv()" title="Abre esta tela em tela cheia, própria para a TV: rola a lista sozinha e atualiza a cada minuto"><span class="sym">tv_gen</span>Modo TV</button>
    <button class="bt p" onclick="salvarVisao()"><span class="sym">bookmark</span>Salvar visão</button>
  </div>
  <div class="erro" id="erro"></div>
  <div class="bk-ov" id="bk-ov" onclick="if(event.target===this)fecharModalBk()"><div class="bk-md" role="dialog" aria-modal="true"><div class="bk-md-h"><h3 id="bk-md-t"></h3><small id="bk-md-s"></small><button type="button" onclick="fecharModalBk()">Fechar ✕</button></div><div class="bk-md-b"><table id="bk-md-tab"></table></div></div></div>
  <div class="visao-tv" id="visao-tv" role="tablist" aria-label="Visão do Painel TV"><span class="rot">Visão</span>
    <div class="seg"><button type="button" data-v="geral" onclick="escolherVisaoTv('geral')">Geral</button><button type="button" data-v="st" onclick="escolherVisaoTv('st')" title="Só chamados de Suporte Técnico (régua de SLA do Hub: 4/8/16/24 h)">Suporte Técnico</button></div>
    <span class="nota" id="visao-nota"></span></div>
  <div class="pd-filt" id="filtros"></div>
  <div class="bk-kpis" id="kpis"></div>
  <div id="bk-split"></div>
  <div class="bk-grid" id="mid"></div>
  <div class="p pd-tab">
    <div class="tool"><h3>Fila de prioridade <small id="ord" style="margin-left:8px"></small></h3><div class="sp"></div>
      <input class="srch" id="busca" type="search" placeholder="Buscar por chamado, cliente, assunto ou responsável…" oninput="BUSCA=this.value;PAG=1;tabela()">
      <div class="bk-pills" id="bk-pills"></div></div>
    <div class="tw" id="tw"></div>
    <div class="mais" id="mais"></div>
  </div>
  <div class="rod"><span>Tempo e prazo em horas úteis líquidas · meta pela urgência (Crítica 4 h · Alta 8 h · Média 16 h · Baixa 24 h) · "Sem retorno" = dias corridos desde a última resposta pública (cliente ou atendente)</span><span id="rodir"></span></div>
</div>
<script>
// Modo TV pela URL (a TV roda sem filtros na tela): ?tv=1  ?k=chave (link da TV, sem login)  ?vertical=agrotitan  ?equipe=Nome  ?classificacao=Nome|todas  ?ano=todos  ?mes=todos  ?tema=claro
const Q=new URLSearchParams(location.search), TV=Q.get('tv')==='1', CHAVE_TV=Q.get('k')||'';
const API=`${location.origin}/api`, BREVE_MIN=240, POR_PAG=TV?600:200;
if(TV){ document.body.classList.add('tv'); if(Q.get('tema')!=='claro') document.documentElement.className='dark'; document.documentElement.classList.add('sem-barras'); }
const tok=()=>localStorage.getItem('token')||localStorage.getItem('authToken')||localStorage.getItem('sessionToken')||'';
async function api(ep){ const k=CHAVE_TV?`${ep.includes('?')?'&':'?'}k=${encodeURIComponent(CHAVE_TV)}`:''; const r=await fetch(`${API}${ep}${k}`,{headers:tok()?{Authorization:`Bearer ${tok()}`}:{},cache:'no-store'}); if(!r.ok){ const b=await r.json().catch(()=>({})); throw new Error(b.error||r.statusText); } return r.json(); }
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const nf=n=>Number(n||0).toLocaleString('pt-BR');
const semAc=t=>String(t||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();
const ticketUrl=id=>`https://viasoft.movidesk.com/Ticket/Edit/${id}`;
function mdSwitchTab(view){
  if(view==='pendentes') return;
  try{ if(window.parent&&window.parent!==window&&typeof window.parent.navigateTo==='function'){ window.parent.navigateTo(view); return; } }catch{}
  location.href=view==='movidesk'?'geral.html':view+'.html';
}
function abrirPainelTV(){ mdSwitchTab('pendentes'); }
function abrirModoTv(){ window.open(`pendentes.html?tv=1&visao=${VISAO}${CHAVE_TV?`&k=${encodeURIComponent(CHAVE_TV)}`:''}`,'_blank'); }

// ── dados derivados ──
const MESES=['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
const HOJE=new Date();
// ── Visão do Painel TV (como no Painel Geral): Geral | Suporte Técnico. Também por link: ?visao=geral|st ──
const VISOES_TV={geral:'Geral',st:'Suporte Técnico'};
const NOTAS_VISAO={geral:'',st:'Classificação, categoria e equipe de suporte · SLA pela régua do Hub'};
let VISAO=(()=>{ const q=Q.get('visao'); if(VISOES_TV[q]) return q; try{ const v=localStorage.getItem('hub_tv_visao'); if(VISOES_TV[v]) return v; }catch{} return 'geral'; })();
const semAcV=t=>String(t||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').trim().toLowerCase();
const equipeContaNoSlaTv=e=>!/^franquia\b/i.test(String(e||'').trim())&&(/suporte/i.test(e||'')||String(e||'').trim().toLowerCase()==='analytics - b.i');
function visaoOk(r){
  if(VISAO==='st') return semAcV(r.classificacao)==='suporte tecnico'&&semAcV(r.categoria)==='suporte tecnico'&&equipeContaNoSlaTv(r.equipe);
  return true;
}
function pintarVisaoTv(){
  document.querySelectorAll('#visao-tv .seg button').forEach(b=>b.classList.toggle('on',b.dataset.v===VISAO));
  const n=document.getElementById('visao-nota'); if(n) n.textContent=NOTAS_VISAO[VISAO]||'';
  const t=document.getElementById('tit'); if(t) t.textContent=VISOES_TV[VISAO];
  document.title=`Painel TV · ${VISOES_TV[VISAO]}`;
}
function escolherVisaoTv(v){ if(!VISOES_TV[v]||v===VISAO) return; VISAO=v; try{ localStorage.setItem('hub_tv_visao',v); }catch{} PAG=1; pintarVisaoTv(); render(); }
let ROWS=[], FOCO={equipe:null,cls:null,cliente:null}, BUSCA='', PILULA='todos', PAG=1, ATUALIZADO=null;
const URG={Crítica:1,Alta:2,Média:3,Baixa:4}, URGC={Crítica:'u1',Alta:'u2',Média:'u3',Baixa:'u4'};
function enriquecer(r){
  const ms=v=>v?new Date(v).getTime():0, agora=Date.now();
  r._ano=r.criado_em?new Date(r.criado_em).getFullYear():null; r._mes=r.criado_em?new Date(r.criado_em).getMonth()+1:null;
  r._equipe=(r.equipe||'').trim()||'Sem equipe'; r._resp=(r.responsavel||'').trim()||'Sem responsável';
  r._serv=String(r.servico||'').split('>')[0].trim()||'Sem serviço'; r._cli=(r.organizacao||r.cliente_nome||'').trim()||'Sem cliente'; r._cls=(r.classificacao||'').trim()||'Sem classificação';
  const meta=Number(r.sla_meta_h)||0, aberto=Number(r.sla_aberto_min)||0;
  r._rest=meta?meta*60-aberto:null;   // minutos úteis restantes (negativo = excesso)
  r._sit=r.sla_hub==='vencido'?'venc':r.sla_hub==='pausado'?'paus':r.sla_hub==='no_prazo'?(r._rest!=null&&r._rest<=BREVE_MIN?'breve':'prazo'):'fora';
  // Fora da régua do Hub (equipe sem "Suporte" no nome, cliente interno…) mas COM previsão de solução no Movidesk: vale o prazo do Movidesk
  // (mesma regra da tela Início): parado = pausado; previsão passada = vencido; senão, no prazo. "Sem prazo" só quando não há previsão.
  r._mdk=false;
  if(r._sit==='fora'&&r.sla_solucao){ r._mdk=true; r._sit=r.base_status==='Stopped'?'paus':ms(r.sla_solucao)<agora?'venc':'prazo'; }
  r._dAb=Math.max(0,Math.floor((agora-ms(r.criado_em))/864e5));
  const pub=Math.max(ms(r.ultima_publica_agente),ms(r.ultima_publica_cliente))||ms(r.criado_em);
  r._ret=Math.max(0,Math.floor((agora-pub)/864e5));
  r._ult=pub;
  r._ag=ms(r.ultima_acao_agente); r._cl=ms(r.ultima_acao_cliente)||ms(r.ultima_publica_cliente);   // última ação de cada lado (agente: resposta ou nota interna)
  return r;
}

// ── filtros (multi-seleção, com "Selecionar todos"; Ano e Mês começam no atual) ──
const DIM=[['equipe','Equipe',r=>r._equipe],['resp','Responsável',r=>r._resp],['serv','Serviço',r=>r._serv],['cli','Cliente',r=>r._cli],['cls','Classificação',r=>r._cls]];
let SEL={};
const padraoSel=()=>{ const s={}; DIM.forEach(([k])=>s[k]=new Set()); return s; };
function lerVisao(){ try{ const v=JSON.parse(localStorage.getItem('hub_pendentes_visao')||'null'); if(!v) return null; const s=padraoSel(); DIM.forEach(([k])=>{ if(Array.isArray(v[k])) s[k]=new Set(v[k].map(String)); }); return s; }catch{ return null; } }
function salvarVisao(){ try{ const o={}; DIM.forEach(([k])=>o[k]=[...SEL[k]]); localStorage.setItem('hub_pendentes_visao',JSON.stringify(o)); aviso('Visão salva neste navegador.'); }catch{} }
function aviso(t){ const e=document.getElementById('erro'); e.textContent=t; e.style.display='block'; e.style.background='var(--grbg)'; e.style.color='var(--gr)'; setTimeout(()=>{e.style.display='none';},2500); }
function rotuloDim(k,v){ return k==='mes'?MESES[Number(v)-1]||v:v; }
const passa=(r,exceto)=>visaoOk(r)&&DIM.every(([k,,f])=>k===exceto||!SEL[k].size||SEL[k].has(f(r)));
function opcoes(k){ const f=DIM.find(d=>d[0]===k)[2], m=new Map(); ROWS.forEach(r=>{ if(!passa(r,k)) return; const v=f(r); if(v!=='') m.set(v,(m.get(v)||0)+1); });
  let l=[...m.entries()]; if(k==='ano') l.sort((a,b)=>b[0]-a[0]); else if(k==='mes') l.sort((a,b)=>a[0]-b[0]); else l.sort((a,b)=>String(a[0]).localeCompare(String(b[0]),'pt'));
  // mantém selecionados que sumiram da lista (ex.: mês atual sem chamados)
  SEL[k].forEach(v=>{ if(!m.has(v)) l.push([v,0]); });
  return l; }
function desenharFiltros(){
  const box=document.getElementById('filtros'); const abertos=[...box.querySelectorAll('.ms.open')].map(e=>e.dataset.k);
  box.innerHTML=DIM.map(([k,nome])=>{ const sel=[...SEL[k]]; const lbl=!sel.length?'Todos':sel.length===1?rotuloDim(k,sel[0]):`${sel.length} selecionados`;
    return `<div class="ms${abertos.includes(k)?' open':''}" data-k="${k}"><div class="f ${sel.length?'on':''}" onclick="abrirMs('${k}')">${nome}: <b>${esc(lbl)}</b><span class="sym">expand_more</span></div><div class="dd" id="dd-${k}"></div></div>`; }).join('')+
    (DIM.some(([k])=>SEL[k].size)?`<div class="chip" onclick="limparFiltros()">✕ Limpar filtros</div>`:'');
  DIM.forEach(([k])=>preencherMs(k));
}
function preencherMs(k){
  const dd=document.getElementById('dd-'+k); if(!dd) return;
  const busca=dd.querySelector('input[type=search]'); const q=busca?busca.value:'';
  const ops=opcoes(k);
  dd.innerHTML=`<input type="search" placeholder="Buscar ${esc(DIM.find(d=>d[0]===k)[1].toLowerCase())}…" value="${esc(q)}" onclick="event.stopPropagation()" oninput="filtrarOps('${k}',this.value)"><div class="ac"><button type="button" onclick="marcarMs('${k}',true)">Selecionar todos</button><button type="button" onclick="marcarMs('${k}',false)">Limpar</button></div>`+
    ops.map(([v,n])=>`<label data-t="${esc(semAc(rotuloDim(k,v)))}"><input type="checkbox" value="${esc(v)}" ${SEL[k].has(v)?'checked':''} onchange="alternarOp('${k}',this)"><span>${esc(rotuloDim(k,v))}</span><small>${nf(n)}</small></label>`).join('');
  if(q) filtrarOps(k,q);
}
function abrirMs(k){ document.querySelectorAll('.ms.open').forEach(e=>{ if(e.dataset.k!==k) e.classList.remove('open'); }); const m=document.querySelector(`.ms[data-k="${k}"]`); m.classList.toggle('open'); const i=m.querySelector('input[type=search]'); if(m.classList.contains('open')&&i) i.focus(); }
document.addEventListener('click',e=>{ if(!e.target.closest('.ms')) document.querySelectorAll('.ms.open').forEach(x=>x.classList.remove('open')); });
function filtrarOps(k,v){ const q=semAc(v).trim(); document.querySelectorAll(`#dd-${k} label`).forEach(l=>{ l.style.display=!q||l.dataset.t.includes(q)?'':'none'; }); }
function alternarOp(k,cb){ if(cb.checked) SEL[k].add(cb.value); else SEL[k].delete(cb.value); PAG=1; render(); }
function marcarMs(k,marcar){ document.querySelectorAll(`#dd-${k} label`).forEach(l=>{ if(l.style.display==='none') return; const cb=l.querySelector('input'); if(marcar) SEL[k].add(cb.value); else SEL[k].delete(cb.value); }); PAG=1; render(); }
function limparFiltros(){ SEL=padraoSel(); FOCO={equipe:null,cls:null,cliente:null}; BUSCA=''; document.getElementById('busca').value=''; PILULA='todos'; PAG=1; render(); }

// ── desenho: "Backlog de chamados" (pendentes pela última ação pública: cliente × agente) ──
const F=()=>ROWS.filter(r=>passa(r));
function icone(n){ return `<span class="sym">${n}</span>`; }
const loc=v=>Number(v||0).toLocaleString('pt-BR');
const ladoDe=r=>(!(r._ag||0)&&!(r._cl||0))||(r._cl||0)>=(r._ag||0)?'cli':'age';   // sem ação pública: vale a abertura (cliente)
const tUlt=r=>Math.max(r._ag||0,r._cl||0);
function tempoAcao(ms){ const m=Math.max(0,Math.round((Date.now()-ms)/60000)); return m<60?`${m} min`:m<2880?`${Math.round(m/60)} h`:`${Math.floor(m/1440)} d`; }
function desenharKpis(f){
  const n=f.length, nCli=f.filter(r=>ladoDe(r)==='cli').length, nAge=n-nCli, pc=v=>`${(n?v/n*100:0).toLocaleString('pt-BR',{maximumFractionDigits:1})}%`;
  const venc=f.filter(r=>r._sit==='venc').length, ret7=f.filter(r=>r._ret>=7), maisAnt=ret7.reduce((m,r)=>Math.max(m,r._ret),0), cli=new Set(f.map(r=>r._cli)).size;
  BK.pend={titulo:'Pendentes',rows:f}; BK.cli={titulo:'Última ação: cliente (aguarda o agente)',rows:f.filter(r=>ladoDe(r)==='cli')}; BK.age={titulo:'Última ação: agente (aguarda o cliente)',rows:f.filter(r=>ladoDe(r)==='age')}; BK.venc={titulo:'Vencidos',rows:f.filter(r=>r._sit==='venc')}; BK.ret7={titulo:'Sem retorno há 7 dias ou mais',rows:ret7};
  const k=(c,ic,l,v,d,bk)=>`<div class="bk-k bk-clk ${c}" data-bk="${bk}" title="Clique para ver os chamados"><div class="l">${icone(ic)}${l}</div><div class="v">${loc(v)}</div><div class="d">${d}</div></div>`;
  document.getElementById('kpis').innerHTML=
    k('','pending_actions','Pendentes',n,`chamados em aberto · ${loc(cli)} cliente${cli===1?'':'s'}`,'pend')+
    k('cli','person','Última ação: cliente',nCli,`${pc(nCli)} do backlog · aguarda o agente`,'cli')+
    k('age','support_agent','Última ação: agente',nAge,`${pc(nAge)} do backlog · aguarda o cliente`,'age')+
    k('venc','','Vencidos',venc,`${pc(venc)} da fila`,'venc')+
    k('','mark_email_unread','Sem retorno +7 dias',ret7.length,ret7.length?`mais antigo: ${maisAnt} d`:'nenhum agora','ret7');
  document.getElementById('bk-split').innerHTML=n?`<div class="bk-split"><i class="bk-clk" data-bk="cli" title="Ver chamados em que o cliente falou por último" style="flex:${nCli};background:var(--cli)"></i><i class="bk-clk" data-bk="age" title="Ver chamados em que o agente falou por último" style="flex:${nAge};background:var(--age)"></i></div><div class="bk-split-l"><span style="color:var(--cli)">Cliente · ${loc(nCli)}</span><span style="color:var(--age)">Agente · ${loc(nAge)}</span></div>`:'';
  return {n,nCli,nAge};
}
function quebra(titulo,tipo,f,chave,max){
  const por={}; f.forEach(r=>{ const k=chave(r); const o=por[k]||(por[k]={cli:0,age:0}); o[ladoDe(r)]++; });
  const lista=Object.entries(por).map(([k,o])=>[k,o,o.cli+o.age]).sort((a,b)=>b[2]-a[2]).slice(0,max), mx=Math.max(1,...lista.map(x=>x[2]));
  lista.forEach(([k])=>{ BK[`${tipo}:${k}`]={titulo:`${titulo.replace(/ · top 5/,'')}: ${k}`,rows:f.filter(r=>chave(r)===k)}; });
  return `<div class="bk-box"><h4>${titulo}<small><em style="color:var(--cli);font-style:normal">cliente</em> / <span style="color:var(--age)">agente</span></small></h4>`+(lista.length?lista.map(([k,o,t])=>`<div class="bk-r" data-bk="${esc(tipo+':'+k)}" title="${esc(k)} · clique para ver os chamados"><div class="n">${esc(k)}</div><div class="b" style="width:${(t/mx*100).toFixed(1)}%"><i style="flex:${o.cli};background:var(--cli)"></i><i style="flex:${o.age};background:var(--age)"></i></div><div class="q"><em>${loc(o.cli)}</em> / <span>${loc(o.age)}</span><b>${loc(t)}</b></div></div>`).join(''):'<div class="vazio">Sem chamados</div>')+`</div>`;
}
function desenharMid(f){
  const el=document.getElementById('mid');
  el.innerHTML=quebra('Por equipe','equipe',f,r=>r._equipe,5)+quebra('Por classificação','cls',f,r=>r._cls,5)+quebra('Por cliente · top 5','cliente',f,r=>r._cli,5)+quebra('Por responsável · top 5','resp',f,r=>r._resp,5);
}

// ── modal com os chamados (ao clicar nos cards, na barra e nas linhas das quebras) ──
const BK={};   // chave -> { titulo, rows }
function abrirModalBk(chave){
  const g=BK[chave]; if(!g||TV) return;
  const rows=g.rows.slice().sort((a,b)=>(ladoDe(a)===ladoDe(b)?0:ladoDe(a)==='cli'?-1:1)||((b._sit==='venc'?1:0)-(a._sit==='venc'?1:0))||(b._dAb-a._dAb));
  document.getElementById('bk-md-t').textContent=g.titulo;
  document.getElementById('bk-md-s').textContent=`${loc(rows.length)} chamado${rows.length===1?'':'s'}`;
  document.getElementById('bk-md-tab').innerHTML=TH_CHAMADOS+`<tbody>${rows.map(linhaChamado).join('')||'<tr><td colspan="7" class="vazio">Nenhum chamado.</td></tr>'}</tbody>`;
  document.getElementById('bk-ov').classList.add('on');
}
function fecharModalBk(){ document.getElementById('bk-ov').classList.remove('on'); }
addEventListener('keydown',e=>{ if(e.key==='Escape') fecharModalBk(); });
document.addEventListener('click',e=>{ const el=e.target.closest('[data-bk]'); if(el) abrirModalBk(el.dataset.bk); });
function foco(t,v){ FOCO[t]=FOCO[t]===v?null:v; PAG=1; render(); }
function filtroLado(l){ PILULA=l; PAG=1; tabela(); }

// ── fila de prioridade ──
const SIT={venc:['Vencido','var(--red)'],breve:['Vence em breve','var(--am)'],paus:['Pausado','var(--gy)'],prazo:['No prazo','var(--gr)'],fora:['Sem prazo','#a3acb9']};
const hUteis=m=>{ const h=Math.abs(m)/60; return `${h.toLocaleString('pt-BR',{maximumFractionDigits:h<10?1:0})} h úteis`; };
const dtMdk=r=>new Date(r.sla_solucao).toLocaleDateString('pt-BR');
const prazoTxt=r=>r._mdk?(r._sit==='paus'?'relógio parado':`${r._sit==='venc'?'venceu em':'previsão'} ${dtMdk(r)}`):r._sit==='venc'?(r._rest!=null?`há ${hUteis(r._rest)}`:''):(r._sit==='breve'||r._sit==='prazo')&&r._rest!=null?`${hUteis(r._rest)} restantes`:r._sit==='paus'?'relógio parado':r.sla_solucao?`previsão ${new Date(r.sla_solucao).toLocaleDateString('pt-BR')}`:'—';
const ini=n=>String(n).split(/\s+/).filter(Boolean).slice(0,2).map(p=>p[0]).join('').toUpperCase()||'?';
function linhasTabela(){
  let l=F();
  if(FOCO.equipe) l=l.filter(r=>r._equipe===FOCO.equipe); if(FOCO.cls) l=l.filter(r=>r._cls===FOCO.cls); if(FOCO.cliente) l=l.filter(r=>r._cli===FOCO.cliente);
  if(PILULA==='cli'||PILULA==='age') l=l.filter(r=>ladoDe(r)===PILULA);
  const q=semAc(BUSCA).trim(); if(q) l=l.filter(r=>semAc(`${r.ticket_id} ${r._cli} ${r.assunto} ${r._resp} ${r._equipe}`).includes(q));
  // quem aguarda o AGENTE (o cliente falou por último) vem primeiro; depois vencidos; depois os mais antigos
  return l.sort((a,b)=>(ladoDe(a)===ladoDe(b)?0:ladoDe(a)==='cli'?-1:1)||((b._sit==='venc'?1:0)-(a._sit==='venc'?1:0))||(b._dAb-a._dAb));
}
const linhaChamado=(r,i)=>{ const lado=ladoDe(r), t=tUlt(r), nome=lado==='cli'?r.ultima_acao_cliente_por:r.ultima_acao_agente_por;
    return `<tr>
      <td><span class="bk-n">${i+1}</span></td>
      <td class="id"><a href="${ticketUrl(r.ticket_id)}" target="_blank" rel="noopener">#${esc(r.ticket_id)}</a></td>
      <td class="cl"><b title="${esc(r._cli)}">${esc(r._cli)}</b><small title="${esc(r.assunto)}">${esc(r.assunto||'—')}</small></td>
      <td><div class="av"><i>${esc(ini(r._resp))}</i><div>${esc(r._resp)}<small title="${esc(r._equipe)}">${esc(r._equipe)}</small></div></div></td>
      <td><span class="bk-pz ${r._sit}">${SIT[r._sit][0]}</span><small style="display:block;color:var(--t3);margin-top:3px;font-weight:600">${esc(prazoTxt(r))}</small></td>
      <td><b>${r._dAb} d</b></td>
      <td title="${t?esc(new Date(t).toLocaleString('pt-BR')):''}"><span class="bk-ua ${lado}"><b>${icone(lado==='cli'?'person':'support_agent')}${lado==='cli'?'Cliente':'Agente'} <span>${t?`há ${tempoAcao(t)}`:'abertura'}</span></b><small>${esc(nome||'—')}</small></span></td>
    </tr>`; };
const TH_CHAMADOS='<thead><tr><th>#</th><th>Chamado</th><th>Cliente · assunto</th><th>Responsável</th><th>Prazo</th><th>Aberto</th><th>Última ação</th></tr></thead>';
function tabela(){
  const l=linhasTabela(), vis=l.slice(0,PAG*POR_PAG), f=F();
  const nCli=f.filter(r=>ladoDe(r)==='cli').length;
  document.getElementById('bk-pills').innerHTML=`<button type="button" class="bk-pill${PILULA==='todos'?' on':''}" onclick="filtroLado('todos')">Todos ${loc(f.length)}</button><button type="button" class="bk-pill cli${PILULA==='cli'?' on':''}" onclick="filtroLado('cli')">Cliente ${loc(nCli)}</button><button type="button" class="bk-pill age${PILULA==='age'?' on':''}" onclick="filtroLado('age')">Agente ${loc(f.length-nCli)}</button>`;
  document.getElementById('ord').textContent='';
  document.getElementById('tw').innerHTML=`<table><thead><tr><th>#</th><th>Chamado</th><th>Cliente · assunto</th><th>Responsável</th><th>Prazo</th><th>Aberto</th><th>Última ação</th></tr></thead>
    <tbody>${vis.map(linhaChamado).join('')||`<tr><td colspan="7" class="vazio">Nenhum chamado com esses filtros.</td></tr>`}</tbody></table>`;
  document.getElementById('mais').innerHTML=l.length>vis.length?`<button class="bt" onclick="PAG++;tabela()">Mostrar mais ${Math.min(POR_PAG,l.length-vis.length)} (faltam ${nf(l.length-vis.length)})</button>`:'';
  document.getElementById('rodir').textContent=`Mostrando ${nf(vis.length)} de ${nf(l.length)}`+(ATUALIZADO?` · atualizado ${ATUALIZADO.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})}`:'');
}
function exportarCsv(){
  const l=linhasTabela(), cab=['Chamado','Cliente','Assunto','Equipe','Responsável','Urgência','Aberto em','Dias em aberto','Dias sem retorno','Última ação pública','Pendente de retorno do','Status','Justificativa','Prazo'];
  const q=v=>`"${String(v??'').replace(/"/g,'""')}"`;
  const linhas=l.map(r=>[r.ticket_id,r._cli,r.assunto,r._equipe,r._resp,r.urgencia,r.criado_em?new Date(r.criado_em).toLocaleDateString('pt-BR'):'',r._dAb,r._ret,ladoDe(r)==='cli'?'Cliente':'Agente',ladoDe(r)==='cli'?'agente':'cliente',r.status_movidesk,r.justificativa,SIT[r._sit][0]].map(q).join(';'));
  const blob=new Blob(['﻿'+[cab.map(q).join(';'),...linhas].join('\r\n')],{type:'text/csv;charset=utf-8'}); const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=`pendentes-${new Date().toISOString().slice(0,10)}.csv`; a.click(); URL.revokeObjectURL(a.href);
}
function render(){
  desenharFiltros(); const f=F(); desenharKpis(f); desenharMid(f); tabela();
  const filtros=[];
  const fc=[FOCO.equipe,FOCO.cls,FOCO.cliente].filter(Boolean);
  document.getElementById('sub').innerHTML=`${nf(f.length)} chamado(s) pendente(s)${filtros.length?` · abertos em ${esc(filtros.join(' / '))}`:''}${fc.length?` · foco: ${esc(fc.join(' + '))} <a href="#" onclick="FOCO={equipe:null,cls:null,cliente:null};PAG=1;render();return false" style="color:var(--or)">limpar foco</a>`:''}`;
}
async function carregar(){
  try{
    const resp=await api('/geral/pendentes');
    ROWS=(resp.rows||[]).map(enriquecer); ATUALIZADO=new Date(); aplicarParametrosUrl(); document.getElementById('erro').style.display='none';
  }catch(e){ const el=document.getElementById('erro'); el.textContent='Não foi possível carregar os pendentes: '+e.message; el.style.display='block'; el.style.background='var(--redbg)'; el.style.color='var(--red)'; }
  render();
}
// Filtros vindos da URL (só na 1ª carga): vertical (com os mesmos apelidos do Painel TV), equipe, classificação, ano e mês
let _urlAplicada=false;
function aplicarParametrosUrl(){
  if(_urlAplicada) return; _urlAplicada=true;
  const slug=t=>semAc(t).replace(/[^a-z0-9]+/g,' ').trim();
  const ALIAS={'agrotitan':'agronegocio','agro':'agronegocio','petroshow':'combustiveis','talentrh':'sistema para rh','talent rh':'sistema para rh','talent':'sistema para rh','rh':'sistema para rh','viasuper':'supermercados','fisco':'fisco contabil','servicos fiscais':'fisco contabil','fiscal':'fisco contabil','oracle':'oracle cloud','bi':'analytics b i','analytics':'analytics b i','automacao':'automacao comercial','fazendas':'agrotitan fazendas','internos':'sistemas internos'};
  const casar=(k,campo,valor,alvoFn)=>{ const a=[...new Set(ROWS.map(campo))].filter(x=>alvoFn(x)===valor); if(a.length) SEL[k]=new Set(a); };
  const v=slug(Q.get('vertical')||''); if(v) casar('serv',r=>r._serv,ALIAS[v]||v,slug);
  const e=semAc(Q.get('equipe')||''); if(e) casar('equipe',r=>r._equipe,e,semAc);
  const c=semAc(Q.get('classificacao')||''); if(c&&c!=='todas') casar('cls',r=>r._cls,c,semAc);
}
// TV: escala pela tela, relógio e rolagem automática da lista (desce devagar, espera no fim e volta ao topo)
function ajustarZoom(){ const z=Math.max(.8,Math.min(2.6,Math.min(innerWidth/1500,innerHeight/860))); document.documentElement.style.setProperty('--z',z.toFixed(3)); }
function iniciarTv(){
  ajustarZoom(); addEventListener('resize',ajustarZoom);
  const rel=()=>{ const e=document.getElementById('relogio'); if(e) e.textContent=new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'}); }; rel(); setInterval(rel,20000);
  let fase='desce', espera=60;
  setInterval(()=>{
    const tw=document.getElementById('tw'); if(!tw) return; const max=tw.scrollHeight-tw.clientHeight; if(max<=4) return;
    if(espera>0){ espera--; return; }
    if(fase==='desce'){ tw.scrollTop+=2; if(tw.scrollTop>=max-2){ fase='topo'; espera=70; } } else { tw.scrollTop=0; fase='desce'; espera=60; }
  },50);
}
SEL=lerVisao()||padraoSel(); pintarVisaoTv(); if(TV) iniciarTv(); carregar(); setInterval(carregar,TV?60*1000:5*60*1000);
</script>

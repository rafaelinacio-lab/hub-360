<!DOCTYPE html>
<html class="light" lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Painel de Reincidências</title>
<script>
  (function(){
    const t=localStorage.getItem('theme')||'light';
    document.documentElement.className=t;
    window.addEventListener('storage',function(e){
      if(e.key==='theme') document.documentElement.className=e.newValue||'light';
    });
  })();
</script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f2f1ee; --surface:#ffffff; --surface-mid:#f7f6f3; --border:#e5e3de; --border-hi:#cac8c2;
  --t1:#1a1917; --t2:#57554f; --t3:#9b9892;
  --p1:#dc2626; --p1-bg:#fee2e2; --p2:#ea580c; --p2-bg:#ffedd5; --p3:#ca8a04; --p3-bg:#fef9c3; --p4:#2563eb; --p4-bg:#dbeafe;
  --ok:#15803d; --ok-bg:#dcfce7; --warn:#b45309; --warn-bg:#fef3c7; --bad:#b91c1c; --bad-bg:#fee2e2;
  --accent:#e85d04; --sh:0 16px 48px rgba(0,0,0,.14);
}
html.dark{
  --bg:#0f1117; --surface:#1a1d27; --surface-mid:#1e2232; --border:#2a2d3a; --border-hi:#3a3e50;
  --t1:#e8e8e2; --t2:#a8a8a0; --t3:#75756e;
  --p1:#f87171; --p1-bg:#3b1515; --p2:#fb923c; --p2-bg:#3a2010; --p3:#facc15; --p3-bg:#33290a; --p4:#60a5fa; --p4-bg:#14264a;
  --ok:#4ade80; --ok-bg:#12301c; --warn:#fbbf24; --warn-bg:#33270a; --bad:#f87171; --bad-bg:#3b1515;
  --sh:0 16px 48px rgba(0,0,0,.5);
}
*{box-sizing:border-box}
*{scrollbar-width:none;-ms-overflow-style:none}
*::-webkit-scrollbar{display:none;width:0;height:0}
body{margin:0;background:var(--bg);color:var(--t1);font-family:Inter,system-ui,sans-serif;font-size:14px}
button,input,select,textarea{font:inherit;color:inherit}
.page{padding:20px 24px 40px;max-width:1400px;margin:0 auto}
.topo{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.topo h1{margin:0;font-size:22px;font-weight:800;letter-spacing:-.01em}
.topo p{margin:2px 0 0;color:var(--t3);font-size:13px;max-width:680px}
.sp{flex:1}
.btn{border:1px solid var(--border-hi);background:var(--surface);border-radius:8px;padding:8px 14px;font-weight:600;font-size:13px;cursor:pointer}
.btn:hover:not(:disabled){background:var(--surface-mid)}
.btn:disabled{opacity:.55;cursor:default}
.btn.primario{background:var(--accent);border-color:var(--accent);color:#fff}
select,input[type=search]{border:1px solid var(--border);background:var(--surface);border-radius:8px;padding:8px 10px;font-size:13px;max-width:100%}
.controles{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.meta{font-size:12px;color:var(--t3)}
.aviso{font-size:13px;padding:10px 12px;border-radius:8px;margin-bottom:12px}
.aviso:empty{display:none}
.aviso.erro{background:var(--bad-bg);color:var(--bad)} .aviso.info{background:var(--surface);border:1px solid var(--border);color:var(--t2)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px;margin-bottom:14px}
.kpi{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:12px 14px;cursor:pointer;text-align:left}
.kpi:hover{border-color:var(--border-hi)}
.kpi[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.kpi .r{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--t3);font-weight:600}
.kpi .n{font-size:28px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.2}
.kpi .s{font-size:12px;color:var(--t3);display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.d{font-weight:700;font-size:11px;border-radius:6px;padding:1px 6px}
.d.sobe{background:var(--bad-bg);color:var(--bad)} .d.desce{background:var(--ok-bg);color:var(--ok)} .d.igual{background:var(--surface-mid);color:var(--t2)}
.grade{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:12px;margin-bottom:14px}
@media (max-width:900px){.grade{grid-template-columns:1fr}}
.painel{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:14px 16px}
.painel h3{margin:0 0 8px;font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--t3)}
.resumo{white-space:pre-wrap;border-left:4px solid var(--accent)}
.rank{display:flex;flex-direction:column;gap:7px}
.rk{display:grid;grid-template-columns:minmax(0,1fr) 120px 34px;gap:8px;align-items:center;font-size:12.5px;cursor:pointer}
.rk:hover .nm{text-decoration:underline}
.rk .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rk .bar{height:8px;border-radius:4px;background:var(--surface-mid);overflow:hidden}
.rk .bar i{display:block;height:100%;background:var(--accent);border-radius:4px}
.rk .v{text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
.tend svg{width:100%;height:120px;display:block}
.leg{display:flex;gap:12px;flex-wrap:wrap;font-size:11.5px;color:var(--t2);margin-top:6px}
.leg i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;vertical-align:-1px}
.abas{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 10px;align-items:center}
.chip{border:1px solid var(--border);background:var(--surface);border-radius:999px;padding:5px 13px;font-size:12px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--t1);color:var(--surface);border-color:var(--t1)}
.cards{display:flex;flex-direction:column;gap:10px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:12px 14px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 12px}
.card h4{margin:0;font-size:14px}
.card .corpo{grid-column:1/-1;display:flex;flex-direction:column;gap:5px;font-size:13px}
.tag{font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;font-weight:700;color:var(--t3);margin-right:6px}
.pill{display:inline-block;border-radius:999px;padding:2px 10px;font-size:11px;font-weight:700;white-space:nowrap}
.c-Alta{background:var(--bad-bg);color:var(--bad)} .c-Média{background:var(--warn-bg);color:var(--warn)} .c-Baixa{background:var(--surface-mid);color:var(--t2)}
.qtd{background:var(--t1);color:var(--surface);border-radius:999px;padding:2px 10px;font-size:12px;font-weight:700;margin-right:6px}
a.id{color:var(--t2);font-weight:600;text-decoration:none;font-variant-numeric:tabular-nums} a.id:hover{text-decoration:underline;color:var(--t1)}
.tk{display:grid;grid-template-columns:auto auto minmax(0,1fr) auto;gap:8px;align-items:baseline;font-size:12.5px}
.tk .as{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.oc{display:grid;grid-template-columns:90px minmax(0,1fr);gap:8px;font-size:12.5px}
.oc b{color:var(--t3);font-weight:600}
.sub{font-size:12px;color:var(--t3)}
.rec{background:var(--warn-bg);color:var(--warn);border-radius:8px;padding:6px 10px;font-size:12.5px}
.vazio{padding:22px;text-align:center;color:var(--t3);background:var(--surface);border:1px dashed var(--border-hi);border-radius:12px}
.carregando{padding:34px;text-align:center;color:var(--t2)}
.spin{display:inline-block;width:18px;height:18px;border:3px solid var(--border-hi);border-top-color:var(--accent);border-radius:50%;animation:g 1s linear infinite;vertical-align:-4px;margin-right:8px}
@keyframes g{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation:none}}
@media (max-width:700px){.tk{grid-template-columns:auto 1fr}.tk .cl,.tk .dt{grid-column:2}.rk{grid-template-columns:minmax(0,1fr) 70px 30px}}
.modo{display:flex;gap:6px;margin-bottom:14px}
.vg-nota{font-size:12px;color:var(--t3);margin:0 0 12px;max-width:900px}
.vg-graf svg{width:100%;height:190px;display:block}
.vg-graf .ax{font-size:10px;fill:var(--t3)}
.vg-graf .bar-t{fill:var(--border-hi)} .vg-graf .bar-r{fill:var(--accent)}
.vg-graf .bar-r:hover,.vg-graf .bar-t:hover{opacity:.75}
.vg-graf .taxa{font-size:10.5px;font-weight:700;fill:var(--t2);text-anchor:middle}
.rk2.cl{cursor:pointer}
[data-d]{cursor:pointer}
[data-d]:hover{border-color:var(--accent)}
[data-d]:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.bar-t,.bar-r{cursor:pointer}
.gv-fundo{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;z-index:50}
.gv-fundo.aberto{display:block}
.gv{position:fixed;top:0;right:0;bottom:0;width:min(860px,100vw);background:var(--bg);box-shadow:var(--sh);display:flex;flex-direction:column;transform:translateX(100%);transition:transform .22s;z-index:51}
.gv.aberta{transform:none}
@media (prefers-reduced-motion:reduce){.gv{transition:none}}
.gv-topo{display:flex;align-items:flex-start;gap:12px;padding:16px 20px;background:var(--surface);border-bottom:1px solid var(--border)}
.gv-topo h2{margin:0;font-size:17px;line-height:1.3}
.gv-topo .x{margin-left:auto;border:none;background:none;font-size:26px;line-height:1;cursor:pointer;color:var(--t2)}
.gv-corpo{flex:1;overflow-y:auto;padding:14px 20px;display:flex;flex-direction:column;gap:8px}
.gv-item{display:grid;grid-template-columns:auto auto minmax(0,1fr) auto;gap:4px 10px;align-items:baseline;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:8px 12px;font-size:12.5px}
.gv-item .as{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.gv-item .sub{grid-column:2/-1}
.gv-pq{grid-column:1/-1 !important;background:var(--surface-mid);border-radius:8px;padding:6px 10px;color:var(--t2)}
.gv-tag{font-size:10.5px;font-weight:700;border-radius:999px;padding:1px 8px;background:var(--bad-bg);color:var(--bad)}
.vg-grade3{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:12px;margin-bottom:14px}
.rk2{display:grid;grid-template-columns:minmax(0,1fr) 110px 54px;gap:8px;align-items:center;font-size:12.5px}
.rk2.cl{cursor:pointer} .rk2.cl:hover .nm{text-decoration:underline}
.rk2 .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rk2 .bar{height:8px;border-radius:4px;background:var(--surface-mid);overflow:hidden}
.rk2 .bar i{display:block;height:100%;background:var(--accent);border-radius:4px}
.rk2 .v{text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
.rk2 .ex{grid-column:1/-1;font-size:11.5px;color:var(--t3);margin:-4px 0 2px}
.kpi.est{cursor:default}
@media (max-width:700px){.rk2{grid-template-columns:minmax(0,1fr) 70px 48px}}
</style>
</head>
<body>
<div class="page">
  <div class="topo">
    <div><h1>Painel de Reincidências</h1>
      <p>O que se repete nos chamados: no mesmo chamado, no mesmo cliente e entre clientes (possível problema de sistema). A IA lê o histórico completo de cada chamado.</p></div>
    <div class="sp"></div>
    <div class="meta" id="frescor" style="text-align:right"></div>
  </div>
  <div class="modo" role="tablist">
    <button class="chip" id="mGeral" type="button" aria-pressed="true">Visão geral · todos os anos</button>
    <button class="chip" id="mIA" type="button" aria-pressed="false">Análise por IA</button>
  </div>
  <div id="vGeral">
    <p class="vg-nota" id="vgNota"></p>
    <div class="controles">
      <label class="meta" for="gAno">Ano</label><select id="gAno"><option value="">Todos os anos</option></select>
      <label class="meta" for="gDias">Voltou em até</label>
      <select id="gDias"><option value="7">7 dias</option><option value="15" selected>15 dias</option><option value="30">30 dias</option><option value="60">60 dias</option></select>
      <select id="gEquipe" aria-label="Equipe"><option value="">Todas as equipes</option></select>
      <select id="gClassif" aria-label="Classificação"><option value="suporte">Suporte Técnico</option><option value="todas">Todas as classificações</option></select>
      <input type="search" id="gCliente" placeholder="Cliente…" aria-label="Filtrar por cliente">
      <button class="btn" id="gLimpar" type="button">Limpar filtros</button>
      <span class="sp"></span><span class="meta" id="gFrescor"></span>
    </div>
    <div class="aviso" id="gAviso" role="status"></div>
    <div class="painel" id="gCobertura" style="margin-bottom:14px"></div>
    <div id="gResultado"><div class="carregando"><span class="spin"></span>Calculando reincidências de todos os anos…</div></div>
  </div>
  <div class="gv-fundo" id="gvFundo"></div>
  <aside class="gv" id="gv" aria-hidden="true" role="dialog" aria-label="Chamados"><div class="gv-topo"><div style="min-width:0"><h2 id="gvTitulo"></h2><div class="sub" id="gvSub"></div></div><button class="x" id="gvFechar" type="button" aria-label="Fechar">&times;</button></div><div class="gv-corpo" id="gvCorpo"></div></aside>
  <div id="vIA" hidden>
  <div class="controles">
    <label class="meta" for="fDias">Período</label>
    <select id="fDias"><option value="7">7 dias</option><option value="15">15 dias</option><option value="30" selected>30 dias</option><option value="60">60 dias</option><option value="90">90 dias</option></select>
    <select id="fServico" aria-label="Serviço"><option value="">Todos os serviços</option></select>
    <button class="btn primario" id="btnAnalisar" type="button">↻ Atualizar análise</button>
    <span class="sp"></span>
    <label class="meta" for="fHist">Ver análise</label>
    <select id="fHist"><option value="">—</option></select>
  </div>
  <div class="aviso" id="aviso" role="status"></div>
  <div id="resultado"></div>
  </div>
</div>
<script>
const API=`${location.origin}/api/reincidencias`;
const tok=()=>localStorage.getItem('token')||localStorage.getItem('authToken')||localStorage.getItem('sessionToken')||'';
async function api(ep,{method='GET',body}={}){
  const r=await fetch(API+ep,{method,headers:{Authorization:`Bearer ${tok()}`,...(body?{'Content-Type':'application/json'}:{})},body:body?JSON.stringify(body):undefined,cache:'no-store'});
  const raw=await r.text(); let d={}; try{d=raw?JSON.parse(raw):{};}catch{d={error:raw};}
  if(!r.ok) throw new Error(d.error||`HTTP ${r.status}`);
  return d;
}
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const fmt=v=>v?new Date(v).toLocaleString('pt-BR',{timeZone:'America/Sao_Paulo',day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'}):'—';
const br=d=>d?String(d).split('-').reverse().join('/'):'—';
const link=id=>`<a class="id" href="https://viasoft.movidesk.com/Ticket/Edit/${id}" target="_blank" rel="noopener" title="Abrir no Movidesk">#${id}</a>`;
const conf=c=>`<span class="pill c-${esc(c)}" title="Confiança da IA">${esc(c)}</span>`;
function aviso(m,t){ const e=$('aviso'); e.textContent=m||''; e.className='aviso'+(m?' '+(t||'info'):''); }
function ha(v){ const m=(Date.now()-new Date(v).getTime())/60000; if(m<2)return 'agora'; if(m<60)return `há ${Math.round(m)} min`; if(m<1440)return `há ${Math.round(m/60)} h`; return `há ${Math.round(m/1440)} d`; }
let C=null, P=null, A=null, S={aba:'geral',busca:'',conf:''};

function delta(atual,ant,menorMelhor=true){
  if(ant==null) return '';
  const d=Math.round((atual-ant)*10)/10; if(!d) return '<span class="d igual" title="Igual à análise anterior comparável">= 0</span>';
  return `<span class="d ${d>0?'sobe':'desce'}" title="Em relação à análise anterior comparável">${d>0?'▲ +':'▼ '}${d}</span>`;
}
function tkLinha(t){ return `<div class="tk">${link(t.id)}<span class="dt sub">${br(t.data)}</span><span class="as" title="${esc(t.assunto)}">${esc(t.assunto)}</span><span class="cl sub">${esc(t.cliente)}</span></div>`; }

function rankings(r){
  const cli=new Map(), mod=new Map();
  r.dimensao0.forEach(x=>cli.set(x.cliente,(cli.get(x.cliente)||0)+x.ocorrencias.length));
  r.dimensaoA.forEach(x=>cli.set(x.cliente,(cli.get(x.cliente)||0)+x.tickets.length));
  r.dimensaoB.forEach(x=>{ const m=x.modulo||'Não identificado'; mod.set(m,(mod.get(m)||0)+x.nClientes); });
  const top=m=>[...m.entries()].sort((a,b)=>b[1]-a[1]).slice(0,7);
  return {cli:top(cli),mod:top(mod)};
}
function rank(titulo,lista,aba,sufixo){
  if(!lista.length) return `<div class="painel"><h3>${titulo}</h3><div class="sub">Sem dados neste período.</div></div>`;
  const mx=lista[0][1];
  return `<div class="painel"><h3>${titulo}</h3><div class="rank">${lista.map(([n,v])=>`<div class="rk" data-aba="${aba}" data-q="${esc(n)}" title="Ver detalhes"><span class="nm">${esc(n)}</span><span class="bar"><i style="width:${Math.max(6,v/mx*100)}%"></i></span><span class="v">${v}</span></div>`).join('')}</div><div class="sub" style="margin-top:6px">${sufixo}</div></div>`;
}
function tendencia(serie){
  const s=serie.slice(-14); if(s.length<2) return '<div class="sub">A tendência aparece quando houver pelo menos duas análises.</div>';
  const W=600,H=120,px=26,py=14, mx=Math.max(1,...s.flatMap(x=>[x.d0,x.da,x.db])), X=i=>px+i*(W-2*px)/(s.length-1), Y=v=>H-py-(v/mx)*(H-2*py);
  const linha=(k,cor)=>`<polyline fill="none" stroke="${cor}" stroke-width="2" points="${s.map((x,i)=>`${X(i)},${Y(x[k])}`).join(' ')}"/>`+s.map((x,i)=>`<circle cx="${X(i)}" cy="${Y(x[k])}" r="${i===s.length-1?3.5:2}" fill="${cor}"><title>${fmt(x.criado_em)} · ${x[k]}</title></circle>`).join('');
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Evolução das reincidências nas últimas análises"><line x1="${px}" x2="${W-px}" y1="${H-py}" y2="${H-py}" stroke="var(--border)"/><text x="2" y="${py}" font-size="10" fill="var(--t3)">${mx}</text><text x="2" y="${H-py}" font-size="10" fill="var(--t3)">0</text>
    ${linha('d0','#e85d04')}${linha('da','#2563eb')}${linha('db','#b91c1c')}</svg>
    <div class="leg"><span><i style="background:#e85d04"></i>No chamado</span><span><i style="background:#2563eb"></i>Mesmo cliente</span><span><i style="background:#b91c1c"></i>Entre clientes</span><span>${s.length} análises</span></div>`;
}
const passa=(txt)=>!S.busca||String(txt).toLowerCase().includes(S.busca);
const passaConf=c=>!S.conf||c===S.conf;

function cardsD0(r){ const l=r.dimensao0.filter(x=>passaConf(x.confianca)&&passa(x.cliente+' '+x.assunto+' '+x.id)); return l.length?l.map(x=>`<div class="card"><div><h4><span class="qtd">${x.ocorrencias.length}×</span>${link(x.id)} ${esc(x.assunto)}</h4><div class="sub">${esc(x.cliente)}</div></div><div>${conf(x.confianca)}</div>
  <div class="corpo">${x.ocorrencias.map(o=>`<div class="oc"><b>${esc(o.quando)}</b><span>${esc(o.resumo)}</span></div>`).join('')}${x.correcao?`<div class="sub"><span class="tag">Correção entre as ocorrências</span>${esc(x.correcao)}</div>`:''}</div></div>`).join(''):'<div class="vazio">Nenhuma recorrência dentro de um mesmo chamado com esses filtros.</div>'; }
function cardsDA(r){ const l=r.dimensaoA.filter(x=>passaConf(x.confianca)&&passa(x.cliente+' '+x.problema)); return l.length?l.map(x=>`<div class="card"><div><h4><span class="qtd">${x.tickets.length}×</span>${esc(x.cliente)} — ${esc(x.problema)}</h4><div class="sub">${br(x.periodo[0])} → ${br(x.periodo[1])}</div></div><div>${conf(x.confianca)}</div>
  <div class="corpo">${x.tickets.map(tkLinha).join('')}${x.justificativa?`<div class="sub">${esc(x.justificativa)}</div>`:''}</div></div>`).join(''):'<div class="vazio">Nenhum cliente com o mesmo problema repetido com esses filtros.</div>'; }
function cardsDB(r){ const l=r.dimensaoB.filter(x=>passaConf(x.confianca)&&passa(x.problema+' '+x.modulo+' '+x.clientes.map(c=>c.cliente).join(' '))); return l.length?l.map(x=>`<div class="card"><div><h4><span class="qtd">${x.nClientes} clientes</span>${esc(x.problema)}</h4><div class="sub">Módulo provável: ${esc(x.modulo||'não identificado')}</div></div><div>${conf(x.confianca)}</div>
  <div class="corpo">${x.tickets.map(tkLinha).join('')}${x.recomendacao?`<div class="rec">${esc(x.recomendacao)}</div>`:''}</div></div>`).join(''):'<div class="vazio">Nenhum problema sistêmico com esses filtros.</div>'; }

function desenhar(){
  const a=A, r=a.resultado, p=a.parametros||{}, tx=P&&P.atual&&P.atual.id===a.id?P.atualTaxa:null, ant=P&&P.atual&&P.atual.id===a.id?P.anterior:null;
  const kp=(id,rot,n,sub,d)=>`<button type="button" class="kpi" data-aba="${id}" aria-pressed="${S.aba===id}"><div class="r">${rot}</div><div class="n">${n}</div><div class="s">${sub}${d||''}</div></button>`;
  const taxa=tx?tx.taxa:0;
  let h=`<div class="kpis">
    ${kp('geral','Taxa de reincidência',taxa+'%',`${tx?tx.envolvidos:0} de ${a.n_tickets} chamados`,ant?delta(taxa,ant.taxa):'')}
    ${kp('d0','No mesmo chamado',r.dimensao0.length,'o problema voltou',ant?delta(r.dimensao0.length,ant.d0):'')}
    ${kp('da','Mesmo cliente',r.dimensaoA.length,'problemas repetidos',ant?delta(r.dimensaoA.length,ant.da):'')}
    ${kp('db','Entre clientes',r.dimensaoB.length,`indício sistêmico (${p.minClientes||3}+)`,ant?delta(r.dimensaoB.length,ant.db):'')}</div>`;
  const rk=rankings(r);
  if(S.aba==='geral'){
    h+=`<div class="grade"><div class="painel resumo"><h3>Para atenção prioritária</h3>${esc(r.resumo||'A IA não destacou casos críticos neste período.')}</div><div class="painel tend"><h3>Tendência</h3>${tendencia(P?P.serie:[])}</div></div>
    <div class="grade">${rank('Clientes que mais se repetem',rk.cli,'da','Ocorrências somadas (no chamado + entre chamados). Clique para ver.')}${rank('Módulos com mais clientes afetados',rk.mod,'db','Clientes distintos por módulo provável.')}</div>
    <div class="painel"><h3>Maiores casos sistêmicos</h3><div class="cards" style="margin-top:6px">${r.dimensaoB.slice(0,3).length?cardsDB({dimensaoB:r.dimensaoB.slice(0,3)}):'<div class="sub">Nenhum problema sistêmico neste período.</div>'}</div></div>`;
  } else {
    h+=`<div class="abas"><input type="search" id="fBusca" placeholder="Filtrar por cliente, assunto ou nº…" value="${esc(S.busca)}" aria-label="Filtrar"><select id="fConf" aria-label="Confiança"><option value="">Qualquer confiança</option>${['Alta','Média','Baixa'].map(c=>`<option ${S.conf===c?'selected':''}>${c}</option>`).join('')}</select><button class="chip" data-aba="geral" type="button">← Visão geral</button></div>`;
    h+=S.aba==='d0'?`<div class="sub" style="margin-bottom:8px">O problema foi “resolvido” e voltou na mesma conversa.</div><div class="cards">${cardsD0(r)}</div>`:
       S.aba==='da'?`<div class="sub" style="margin-bottom:8px">O mesmo cliente com o mesmo tipo de problema em chamados diferentes.</div><div class="cards">${cardsDA(r)}</div>`:
       `<div class="sub" style="margin-bottom:8px">O mesmo problema em vários clientes: possível bug sistêmico ou lacuna de produto.</div><div class="cards">${cardsDB(r)}</div>`;
  }
  $('resultado').innerHTML=h;
  $('frescor').innerHTML=`Análise #${a.id} · ${ha(a.criado_em)} <span title="${fmt(a.criado_em)}">(${fmt(a.criado_em)})</span><br>${a.n_tickets} chamados · últimos ${p.dias} dias${p.servico?' · '+esc(p.servico):''} · ${p.origem==='automatica'?'automática':'manual'}${p.truncado?' · <b>limitada aos '+p.maxTickets+' mais recentes</b>':''}`;
  const b=$('fBusca'); if(b){ b.addEventListener('input',()=>{ S.busca=b.value.trim().toLowerCase(); const pos=b.selectionStart; desenhar(); const n=$('fBusca'); n.focus(); n.setSelectionRange(pos,pos); }); $('fConf').addEventListener('change',()=>{ S.conf=$('fConf').value; desenhar(); }); }
}

const G={f:{ano:'',dias:'15',equipe:'',classif:'suporte',cliente:''},d:null,carregado:false};
const nf=n=>Number(n||0).toLocaleString('pt-BR');
const pc=(a,b)=>b?Math.round(a/b*1000)/10:0;
const MES=['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
function gBarras(lista,rotulo,mostrarTaxa,soClientes){
  if(!lista.length) return '<div class="sub">Sem dados para estes filtros.</div>';
  const W=640,H=190,pl=34,pb=22,pt=16,pr=6, n=lista.length, mx=Math.max(1,...lista.map(x=>x.n)), bw=(W-pl-pr)/n, Y=v=>H-pb-(v/mx)*(H-pb-pt);
  const cols=lista.map((x,i)=>{
    const cx=pl+i*bw, g=Math.min(bw*0.8,46), l=cx+(bw-g)/2, tt=soClientes?`${rotulo(x)}: ${nf(x.clientes)} clientes com reincidência`:`${rotulo(x)}: ${nf(x.reinc)} reincidentes de ${nf(x.n)} chamados (${pc(x.reinc,x.n)}%) · ${nf(x.clientes)} clientes`;
    return `<g data-d="${rotulo.__tipo||'ano'}" data-v="${esc(rotulo.__chave?rotulo.__chave(x):'')}" data-t="${esc(rotulo(x))}"><rect class="bar-t" x="${l}" y="${Y(x.n)}" width="${g}" height="${H-pb-Y(x.n)}" rx="2"><title>${esc(tt)}</title></rect>`+
      `<rect class="bar-r" x="${l}" y="${Y(x.reinc)}" width="${g}" height="${H-pb-Y(x.reinc)}" rx="2"><title>${esc(tt)}</title></rect>`+
      (mostrarTaxa&&bw>34?`<text class="taxa" x="${l+g/2}" y="${Y(x.n)-4}">${pc(x.reinc,x.n)}%</text>`:'')+
      (n<=14||i%Math.ceil(n/14)===0?`<text class="ax" x="${l+g/2}" y="${H-6}" text-anchor="middle">${esc(rotulo(x))}</text>`:'')+`</g>`;
  }).join('');
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Chamados e reincidentes por período"><line x1="${pl}" x2="${W-pr}" y1="${H-pb}" y2="${H-pb}" stroke="var(--border)"/>
    <text class="ax" x="2" y="${pt+4}">${nf(mx)}</text><text class="ax" x="2" y="${H-pb}">0</text>${cols}</svg>
    <div class="leg"><span><i style="background:var(--border-hi)"></i>Chamados com motivo classificado</span><span><i style="background:var(--accent)"></i>Reincidentes</span>${mostrarTaxa?'<span>% = taxa de reincidência</span>':''}</div>`;
}
function gRank(titulo,lista,{nome,sub,tipo,legenda}){
  if(!lista.length) return `<div class="painel"><h3>${titulo}</h3><div class="sub">Sem reincidência para estes filtros.</div></div>`;
  const mx=Math.max(1,...lista.map(x=>x.reinc));
  return `<div class="painel"><h3>${titulo}</h3><div class="rank">${lista.map(x=>`<div class="rk2 cl" data-d="${tipo}" data-v="${esc(nome(x))}" data-t="${esc(nome(x))}" tabindex="0" role="button" title="Ver os chamados"><span class="nm" title="${esc(nome(x))}">${esc(nome(x))}</span><span class="bar"><i style="width:${Math.max(4,x.reinc/mx*100)}%"></i></span><span class="v">${nf(x.reinc)}</span><span class="ex">${sub(x)}</span></div>`).join('')}</div>${legenda?`<div class="sub" style="margin-top:6px">${legenda}</div>`:''}</div>`;
}
function gDesenhar(){
  const d=G.d, k=d.kpi, f=d.filtros;
  const kp=(r,n,s,kpi)=>`<div class="kpi est" ${kpi?`data-d="kpi" data-v="${kpi}" data-t="${esc(r)}" tabindex="0" role="button" title="Ver os chamados"`:''}><div class="r">${r}</div><div class="n">${n}</div><div class="s">${s}</div></div>`;
  const taxa=pc(k.reincidentes,k.classificados);
  const porAno=!f.ano;
  const serie=porAno?d.anual:d.mensal;
  const rot=porAno?(x=>String(x.ano)):(x=>{ const [a,m]=x.mes.split('-'); return `${MES[+m-1]}/${a.slice(2)}`; });
  rot.__tipo=porAno?'ano':'mes'; rot.__chave=x=>porAno?String(x.ano):x.mes;
  const rotM=x=>{ const [a,m]=x.mes.split('-'); return `${MES[+m-1]}/${a.slice(2)}`; }; rotM.__tipo='mes'; rotM.__chave=x=>x.mes;
  const h=`<div class="kpis">
    ${kp('Chamados reincidentes',nf(k.reincidentes),`${taxa}% dos ${nf(k.classificados)} classificados`,'reincidentes')}
    ${kp('Clientes afetados',nf(k.clientesAfetados),`de ${nf(k.clientes)} clientes (${pc(k.clientesAfetados,k.clientes)}%)`,'clientesAfetados')}
    ${kp('Motivos que se repetem',nf(k.motivosAfetados),'módulos/rotinas ou causas distintas','motivosAfetados')}
    ${kp('Chamados analisados',nf(k.classificados),`${nf(k.semMotivo)} sem motivo ou cliente ficaram de fora`,'classificados')}
    ${kp('Reabertos no Movidesk',nf(k.reabertos),'o mesmo chamado foi reaberto','reabertos')}</div>
    <div class="grade" style="grid-template-columns:minmax(0,1.6fr) minmax(0,1fr)">
      <div class="painel vg-graf"><h3>${porAno?'Reincidência por ano':'Reincidência por mês · '+esc(f.ano)}</h3>${gBarras(serie,rot,true)}</div>
      <div class="painel vg-graf"><h3>Clientes afetados por ${porAno?'ano':'mês'}</h3>${gBarras(serie.map(x=>({...x,n:x.clientes,reinc:x.clientes})),rot,false,true).replace(/Chamados com motivo classificado/,'Clientes distintos com reincidência').replace(/<span><i style="background:var\(--accent\)"><\/i>Reincidentes<\/span>/,'')}</div>
    </div>
    ${porAno&&d.mensal.length>12?`<div class="painel vg-graf" style="margin-bottom:14px"><h3>Evolução mensal (todos os anos)</h3>${gBarras(d.mensal,rotM,false)}</div>`:''}
    <div class="vg-grade3">
      ${gRank('Top motivos de reincidência',d.motivos,{tipo:'motivo',nome:x=>x.motivo,sub:x=>`${nf(x.clientes)} clientes · ${pc(x.reinc,x.n)}% dos ${nf(x.n)} chamados deste motivo voltaram`,legenda:'Chamados que voltaram. Agrupado pelo módulo/rotina (ou causa) só para leitura. Clique para ver os chamados.'})}
      ${gRank('Clientes que mais reincidem',d.clientes,{tipo:'cliente',nome:x=>x.cliente,sub:x=>`${nf(x.motivos)} motivos · principal: ${esc(x.principal||'—')}`,legenda:'Clique para ver os chamados do cliente.'})}
      ${gRank('Equipes com mais reincidência',d.equipes,{tipo:'equipe',nome:x=>x.equipe,sub:x=>`${pc(x.reinc,x.n)}% dos ${nf(x.n)} chamados`,legenda:'Equipe responsável pelo chamado. Clique para ver os chamados.'})}
    </div>`;
  $('gResultado').innerHTML=h;
  $('gFrescor').textContent=`Calculado ${ha(d.geradoEm)}${d.cache?' (em cache, até 10 min)':''}`;
  $('vgNota').innerHTML=`Um chamado é <b>reincidente</b> quando a <b>IA</b>, lendo o <b>contexto e as ações</b> dele e dos chamados anteriores do mesmo cliente (encerrados até ${f.dias} dias antes), conclui que é o <b>mesmo problema</b> voltando. `+
    `O módulo/rotina é só uma dica e um filtro de agrupamento, não decide. Só entram na taxa os chamados já analisados pela IA (veja a cobertura abaixo).`;
  const sa=$('gAno'); if(sa.options.length<=1||sa.dataset.n!==String(d.anos.length)){ sa.innerHTML='<option value="">Todos os anos</option>'+d.anos.map(a=>`<option>${a}</option>`).join(''); sa.dataset.n=String(d.anos.length); }
  sa.value=f.ano?String(f.ano):'';
  const se=$('gEquipe'); if(se.dataset.n!==String(d.equipesLista.length)){ se.innerHTML='<option value="">Todas as equipes</option>'+d.equipesLista.map(e=>`<option>${esc(e)}</option>`).join(''); se.dataset.n=String(d.equipesLista.length); }
  se.value=f.equipe||'';
}
async function gCarregar(){
  const q=new URLSearchParams({dias:G.f.dias,classif:G.f.classif==='todas'?'todas':'suporte'}); ['ano','equipe','cliente'].forEach(k=>{ if(G.f[k]) q.set(k,G.f[k]); });
  $('gAviso').textContent=''; $('gAviso').className='aviso';
  if(!G.d) $('gResultado').innerHTML='<div class="carregando"><span class="spin"></span>Calculando reincidências de todos os anos… (cerca de 5 segundos na primeira vez)</div>';

  try{ G.d=await api('/geral?'+q); G.carregado=true; gDesenhar(); cobAtualizar(); }
  catch(e){ $('gAviso').textContent=e.message; $('gAviso').className='aviso erro'; }
  $('gResultado').style.opacity='';
}

    (j.rodando||j.fim?`<div class="sub" style="margin-top:6px">${j.rodando?`<span class="spin"></span> ${nf(j.feitos)} de ${nf(j.total)} analisados…`:esc(j.msg||'')}${j.erros?` · ${j.erros} erro(s)`:''}</div>`:'')+`<div style="margin-top:8px">${botao}</div>`;

  $('fDias').value=String(C.diasPadrao);
  $('fServico').innerHTML='<option value="">Todos os serviços</option>'+C.servicos.map(s=>`<option>${esc(s)}</option>`).join('');
  if(!C.podeAnalisar) $('btnAnalisar').style.display='none';
  else if(!C.ativo){ $('btnAnalisar').disabled=true; aviso('Este recurso de IA está desativado em Configurações → Assistente de IA.','info'); }
  else if(!C.iaConfigurada){ $('btnAnalisar').disabled=true; aviso('A chave da IA ainda não foi configurada (Configurações → Inteligência Artificial).','info'); }
  await Promise.all([carregarPainel(),carregarHistorico()]);
  setInterval(()=>{ if(!document.hidden && !$('fHist').value && !$('btnAnalisar').disabled) carregarPainel(); },5*60*1000);
})();
</script>
</body>
</html>

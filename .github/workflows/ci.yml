name: Regression checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: Movidesk/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
        working-directory: Movidesk
      - run: npm run check && npm test
        working-directory: Movidesk
      - run: python -m py_compile Jira/jira_extractor.py && python -m unittest discover -s Jira/tests -v
      - run: npm audit --omit=dev
        working-directory: Movidesk
